[package]
name = "komori"
version = "0.1.0"
edition = "2024"

[dependencies]
# TUI Framework
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# File System (with .gitignore support)
ignore = "0.4"

# Syntax Highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Error Handling
color-eyre = "0.6"

[profile.release]
lto = true
strip = true
